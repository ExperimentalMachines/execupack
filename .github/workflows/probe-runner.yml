name: Probe runner
# Phase 0: what a standard hosted runner really has, and what an export really costs, so
# the sizing estimates in pipeline/sizing.py can be calibrated. Publishes nothing.

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Model to export at each window
        default: Qwen/Qwen3-0.6B
        type: string
      contexts:
        description: JSON list of windows, one job each
        default: "[2048, 8192]"
        type: string

permissions:
  contents: read

jobs:
  calibrate:
    strategy:
      fail-fast: false
      matrix:
        context: ${{ fromJSON(inputs.contexts) }}
    # The causal masks grow with the window squared and have killed a 32k export before
    # (docs/research findings 2 and 28). x86, because the wheel's C++ TextLLMRunner raises
    # `IndexError: stoi` on aarch64 (finding 30). The Namespace profile has no swap, so the
    # swap asked for below is not added there.
    runs-on: namespace-profile-execupack
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      MODEL_ID: ${{ inputs.model_id }}
      CONTEXT: ${{ matrix.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Runner hardware
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Flags' | cut -c1-200
          grep -E 'MemTotal|SwapTotal' /proc/meminfo
          lsblk -b -o NAME,SIZE,MOUNTPOINT

      - uses: ./.github/actions/setup-export
        with:
          swap-gib: "24"

      - name: Export at a forced window
        # Exit 4 is the gate refusing a window this runner cannot hold (16k and up for
        # Qwen3-0.6B on the Namespace profile): a measurement in itself, not a failure.
        run: |
          set +e
          python -m pipeline export-xnnpack "$MODEL_ID" --context "$CONTEXT" --out "$WORK_DIR/out" --work "$WORK_DIR/work"
          code=$?
          if [ "$code" -eq 4 ]; then
            echo "::notice::Window $CONTEXT skipped: it does not fit this runner."
            exit 0
          fi
          exit "$code"

      - name: Summary
        if: always()
        run: |
          if compgen -G "$WORK_DIR/out/xnnpack/export-report*.json" >/dev/null; then
            python -m pipeline summary "$WORK_DIR/out" --backend xnnpack >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: probe-${{ matrix.context }}
          path: ${{ env.WORK_DIR }}/out/xnnpack/export-report-*.json
          if-no-files-found: warn
