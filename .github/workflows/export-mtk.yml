name: Export MediaTek
run-name: "MediaTek: ${{ inputs.model_id }}@${{ inputs.revision }}${{ inputs.precision && format(' {0}', inputs.precision) || '' }}${{ inputs.contexts && format(' ctx {0}', inputs.contexts) || '' }}${{ inputs.prompt_tokens && format(' {0}t', inputs.prompt_tokens) || '' }}"

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Hugging Face model id of a family with a MediaTek recipe (families.mtk_plan), e.g. Qwen/Qwen3-0.6B
        required: true
        type: string
      revision:
        description: Branch, tag or commit of the source repo
        default: main
        type: string
      socs:
        description: JSON list of chips, or empty for mtk.socs in config/pipeline.yaml
        default: ""
        type: string
      contexts:
        description: JSON list of context windows in tokens, one job per chip and window; empty for every tier in config/pipeline.yaml plus mtk.cache_size
        default: ""
        type: string
      max_chunks:
        description: "Maximum chunks to divide the model into (LFM2.5 at 16k built with at most one attention layer per chunk, 8 for the 1.2B and 10 for the 2.6B); empty for mtk.max_chunks in config/pipeline.yaml"
        default: ""
        type: string
      precision:
        description: NeuroPilot precision (A16W4, A16W8); empty for mtk.precision in config/pipeline.yaml
        default: ""
        type: string
      prompt_tokens:
        description: Tokens per prompt-graph call; empty for mtk.prompt_tokens in config/pipeline.yaml
        default: ""
        type: string
      publish_hf:
        description: Publish to the Hugging Face org in config/pipeline.yaml
        default: true
        type: boolean
      publish_release:
        description: Attach the files to a GitHub release
        default: true
        type: boolean

permissions:
  contents: write # GitHub releases

concurrency:
  group: export-mtk-${{ inputs.model_id }}-${{ inputs.precision }}-${{ inputs.prompt_tokens }}
  cancel-in-progress: false

jobs:
  targets:
    # Hub metadata only, no model download: it reads a config.json and does arithmetic.
    runs-on: ubuntu-latest
    env:
      # The matrix now reads the model's config to size each window's runner, and some of
      # the watched repos are private, so this job needs the token the export job has.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    outputs:
      socs: ${{ steps.socs.outputs.socs }}
      entries: ${{ steps.contexts.outputs.entries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-light
      - id: socs
        env:
          SOCS: ${{ inputs.socs }}
        run: |
          if [ -z "$SOCS" ]; then
            SOCS=$(python3 -c 'import json, yaml; print(json.dumps(yaml.safe_load(open("config/pipeline.yaml"))["export"]["mtk"]["socs"]))')
          fi
          echo "socs=$SOCS" >>"$GITHUB_OUTPUT"
      - id: contexts
        env:
          CONTEXTS: ${{ inputs.contexts }}
          MODEL_ID: ${{ inputs.model_id }}
          REVISION: ${{ inputs.revision }}
          PROMPT_TOKENS: ${{ inputs.prompt_tokens }}
        # One entry per window, each carrying the Modal Sandbox that can build it: memory from
        # pipeline.export_mtk.calibration_bytes (the same estimate the export gates on),
        # cores and minutes from export_mtk.MODAL_SHAPES, and the chunk count for a hybrid at
        # 16k and up.
        run: |
          entries=$(python3 -m pipeline mtk-matrix "$MODEL_ID" --revision "$REVISION" --contexts "$CONTEXTS" \
            ${PROMPT_TOKENS:+--prompt-tokens "$PROMPT_TOKENS"})
          echo "$entries"
          echo "entries=$entries" >>"$GITHUB_OUTPUT"

  export:
    needs: targets
    # An empty matrix is an error to GitHub, so a model no runner can carry stops at targets.
    if: ${{ needs.targets.outputs.entries != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        soc: ${{ fromJSON(needs.targets.outputs.socs) }}
        entry: ${{ fromJSON(needs.targets.outputs.entries) }}
    # The export runs on Modal, in a Sandbox the targets job sized to this window: memory
    # from export_mtk.calibration_bytes plus modal.memory_margin, and cores and minutes from
    # export_mtk.MODAL_SHAPES, because streaming calibration's time grows with the window.
    # This job only sends it, waits, and publishes what comes back. Modal's hosts are x86,
    # which mtk_converter 8.13.0 (a cp310 x86 build) and the SDK's libraries need (finding 14).
    runs-on: ubuntu-latest
    # GitHub-hosted jobs stop at 360 minutes: past the longest Sandbox (export_mtk.MODAL_SHAPES),
    # so the Sandbox is what times out and says so.
    timeout-minutes: 350
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      MODEL_ID: ${{ inputs.model_id }}
      REVISION: ${{ inputs.revision }}
      SOC: ${{ matrix.soc }}
      CONTEXT: ${{ matrix.entry.context }}
      MEMORY_MIB: ${{ matrix.entry.memory_mib }}
      CORES: ${{ matrix.entry.cpu }}
      SANDBOX_MINUTES: ${{ matrix.entry.timeout_minutes }}
      # The input wins; otherwise the targets job's one-attention-layer-per-chunk count for a
      # hybrid at 16k and up (finding 39), otherwise mtk.max_chunks.
      MTK_MAX_CHUNKS: ${{ inputs.max_chunks || matrix.entry.max_chunks }}
      MTK_PRECISION: ${{ inputs.precision }}
      MTK_PROMPT_TOKENS: ${{ inputs.prompt_tokens }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-modal

      - name: Name things
        run: |
          soc_lower=$(echo "$SOC" | tr '[:upper:]' '[:lower:]')
          echo "TARGET=$soc_lower" >>"$GITHUB_ENV"
          echo "ARTIFACT=mtk-${soc_lower}-${MODEL_ID//\//--}-${CONTEXT}" >>"$GITHUB_ENV"

      # scripts/mtk-setup.sh downloads the NeuroPilot SDK inside the Sandbox, checks it, installs
      # its two wheels and deletes it, then fetches and patches ExecuTorch's examples/mediatek:
      # nothing of the SDK is in the image, cached or brought back. Exit 4 means this window
      # cannot be built (the export's own gate): recorded as a skip, so the other jobs of the
      # matrix stand on their own.
      - name: Export on Modal
        run: |
          set +e
          python -m pipeline modal-run --memory-mib "$MEMORY_MIB" --cpu "$CORES" --timeout-minutes "$SANDBOX_MINUTES" \
            --requirements requirements/export-mtk.txt --mtk-tools requirements/mtk-tools.txt \
            --get "$WORK_DIR/out" \
            --script 'bash scripts/mtk-setup.sh && python -m pipeline export-mtk "$MODEL_ID" --soc "$SOC" --revision "$REVISION" --out "$OUT" --work "$WORK/export" --context "$CONTEXT" --tool-python /opt/mtk-venv/bin/python --examples "$WORK/executorch/examples/mediatek"'
          rc=$?
          set -e
          if [ "$rc" -eq 4 ]; then
            echo "SKIPPED=1" >>"$GITHUB_ENV"
            echo "::warning title=Window skipped::$MODEL_ID at $CONTEXT tokens on $SOC cannot be exported"
            exit 0
          fi
          exit "$rc"

      - name: Summary
        if: always() && env.SKIPPED != '1'
        run: |
          if compgen -G "$WORK_DIR/out/mtk/$TARGET/export-report*.json" >/dev/null; then
            python -m pipeline summary "$WORK_DIR/out" --backend mtk --target "$TARGET" >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && env.SKIPPED != '1'
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.WORK_DIR }}/out
          retention-days: 14
          if-no-files-found: warn

      - name: Publish to Hugging Face
        if: inputs.publish_hf && env.SKIPPED != '1'
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Set the HF_TOKEN repository secret (write access to the output org)"
            exit 1
          fi
          python -m pipeline publish-hf "$WORK_DIR/out" --backend mtk --target "$TARGET"

      - name: Publish GitHub release
        if: inputs.publish_release && env.SKIPPED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline publish-release "$WORK_DIR/out" --backend mtk --target "$TARGET"
