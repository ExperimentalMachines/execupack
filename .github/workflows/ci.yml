name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Lint and unit tests only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Runner
        # What the runner really has, for the record (the exports run on Modal, not here).
        run: |
          echo "arch $(uname -m), $(nproc) CPUs"
          grep -E 'MemTotal|MemAvailable|SwapTotal' /proc/meminfo
          df -B1 / /mnt 2>/dev/null || df -B1 /
          if sudo -n fallocate -l 1G /execupack-swaptest 2>/dev/null && sudo mkswap /execupack-swaptest >/dev/null \
             && sudo swapon /execupack-swaptest; then
            echo "swap file: works"; sudo swapoff /execupack-swaptest
          else
            echo "swap file: refused"
          fi
          sudo rm -f /execupack-swaptest

      - name: Read versions
        id: versions
        run: grep -E '^[A-Z_]+=' config/versions.env >>"$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install
        run: |
          python -m pip install -r requirements/dev.txt
          # torch and safetensors for the checkpoint converter tests.
          python -m pip install "$(grep -E '^torch==' requirements/export-xnnpack.txt)" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "$(grep -E '^safetensors==' requirements/export-xnnpack.txt)" numpy
          # executorch for the QNN structural-check test (it builds and inspects a tiny .pte).
          python -m pip install "$(grep -E '^executorch==' requirements/export-xnnpack.txt)"

      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
