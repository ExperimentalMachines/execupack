name: Export Vulkan
run-name: "Vulkan: ${{ inputs.model_id }}@${{ inputs.revision }}${{ inputs.contexts && format(' ctx {0}', inputs.contexts) || '' }}"

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Hugging Face model id, e.g. Qwen/Qwen3-1.7B
        required: true
        type: string
      revision:
        description: Branch, tag or commit of the source repo
        default: main
        type: string
      contexts:
        description: JSON list of context windows in tokens, one job each; empty for every tier in config/pipeline.yaml
        default: ""
        type: string
      publish_hf:
        description: Publish to the Hugging Face org in config/pipeline.yaml
        default: true
        type: boolean
      publish_release:
        description: Attach the files to a GitHub release
        default: true
        type: boolean

permissions:
  contents: write # GitHub releases

concurrency:
  group: export-vulkan-${{ inputs.model_id }}
  cancel-in-progress: false

jobs:
  targets:
    # Hub metadata only, no model download: reads config.json and does arithmetic.
    runs-on: namespace-profile-execupack
    env:
      # Sizing reads the model's config, and gated repos (Llama 3.2) need the token.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    outputs:
      entries: ${{ steps.contexts.outputs.entries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: contexts
        env:
          CONTEXTS: ${{ inputs.contexts }}
          MODEL_ID: ${{ inputs.model_id }}
          REVISION: ${{ inputs.revision }}
        # One entry per window, each with the smallest runner that holds it
        # (pipeline.export_xnnpack.pick_runner over vulkan.runner_tiers). The export job gates
        # on the same sizing.host_need_bytes, so the two cannot disagree about a window; one
        # no tier can carry is left out here rather than started on a runner it would kill.
        run: |
          python3 -m pip install --quiet -r requirements/dev.txt
          entries=$(python3 -m pipeline export-matrix "$MODEL_ID" --revision "$REVISION" --backend vulkan --contexts "$CONTEXTS")
          echo "$entries"
          echo "entries=$entries" >>"$GITHUB_OUTPUT"

  export:
    needs: targets
    # An empty matrix is an error to GitHub, so a model no runner can carry stops at targets.
    if: ${{ needs.targets.outputs.entries != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.targets.outputs.entries) }}
    # Sized per window by the targets job: the export peak grows with the window squared
    # (every attention layer holds a window x window causal mask), so Qwen3-4B needs ~33 GiB
    # at 2k and ~108 GiB at 32k. A window no tier in vulkan.runner_tiers can carry is left
    # out; since 2026-10-07 that tier is the 15.7 GiB Namespace profile, with no swap. The
    # runner has no GPU, so the file gets a structural check (findings 28, 30).
    runs-on: ${{ matrix.entry.runner }}
    timeout-minutes: 350
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      MODEL_ID: ${{ inputs.model_id }}
      REVISION: ${{ inputs.revision }}
      CONTEXT: ${{ matrix.entry.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-export
        with:
          swap-gib: ${{ matrix.entry.swap_gib }}

      # Exit 4 means this runner cannot build this window (memory grows with the square of
      # the window): recorded as a skip, so the other windows' jobs stand on their own.
      # The runner has no GPU: the file gets a structural check, the device benchmarks run it.
      - name: Export and check
        run: |
          echo "ARTIFACT=vulkan-${MODEL_ID//\//--}-${CONTEXT}" >>"$GITHUB_ENV"
          set +e
          python -m pipeline export-vulkan "$MODEL_ID" --revision "$REVISION" --context "$CONTEXT" \
            --out "$WORK_DIR/out" --work "$WORK_DIR/work"
          rc=$?
          set -e
          if [ "$rc" -eq 4 ]; then
            echo "SKIPPED=1" >>"$GITHUB_ENV"
            echo "::warning title=Window skipped::$MODEL_ID at $CONTEXT tokens cannot be exported on this runner"
            exit 0
          fi
          exit "$rc"

      - name: Summary
        if: always() && env.SKIPPED != '1'
        run: |
          if compgen -G "$WORK_DIR/out/vulkan/export-report*.json" >/dev/null; then
            python -m pipeline summary "$WORK_DIR/out" --backend vulkan >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && env.SKIPPED != '1'
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.WORK_DIR }}/out
          retention-days: 14
          if-no-files-found: warn

      - name: Publish to Hugging Face
        if: inputs.publish_hf && env.SKIPPED != '1'
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Set the HF_TOKEN repository secret (write access to the output org)"
            exit 1
          fi
          python -m pipeline publish-hf "$WORK_DIR/out" --backend vulkan

      - name: Publish GitHub release
        if: inputs.publish_release && env.SKIPPED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline publish-release "$WORK_DIR/out" --backend vulkan
