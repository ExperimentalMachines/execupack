name: Export XNNPACK
run-name: "XNNPACK: ${{ inputs.model_id }}@${{ inputs.revision }}${{ inputs.contexts && format(' ctx {0}', inputs.contexts) || '' }}"

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Hugging Face model id, e.g. Qwen/Qwen3-1.7B
        required: true
        type: string
      revision:
        description: Branch, tag or commit of the source repo
        default: main
        type: string
      contexts:
        description: JSON list of context windows in tokens, one job each; empty for every tier in config/pipeline.yaml
        default: ""
        type: string
      gptq:
        description: Solve the int4 codes with GPTQ instead of rounding them (one solve, reused by every window)
        default: true
        type: boolean
      qmode:
        description: "Recipe: empty for the config's 8da4w, or fp32 (linears not quantized; the solve only writes the gate's fp32 reference)"
        default: ""
        type: string
      publish_hf:
        description: Publish to the Hugging Face org in config/pipeline.yaml
        default: true
        type: boolean
      publish_release:
        description: Attach the files to a GitHub release
        default: true
        type: boolean

permissions:
  contents: write # GitHub releases

concurrency:
  group: export-xnnpack-${{ inputs.model_id }}
  cancel-in-progress: false

jobs:
  targets:
    # Hub metadata only, no model download: reads config.json and does arithmetic.
    runs-on: namespace-profile-execupack
    env:
      # Sizing reads the model's config, and gated repos (Llama 3.2) need the token.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    outputs:
      entries: ${{ steps.contexts.outputs.entries }}
      contexts: ${{ steps.contexts.outputs.contexts }}
      solve_runner: ${{ steps.contexts.outputs.solve_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: contexts
        env:
          CONTEXTS: ${{ inputs.contexts }}
          MODEL_ID: ${{ inputs.model_id }}
          REVISION: ${{ inputs.revision }}
        # One entry per window with the smallest runner that holds it (export-matrix over
        # xnnpack.runner_tiers); the export job gates on the same sizing.host_need_bytes. A
        # window no tier can carry is left out here, and verify follows the same list.
        run: |
          python3 -m pip install --quiet -r requirements/dev.txt
          entries=$(python3 -m pipeline export-matrix "$MODEL_ID" --revision "$REVISION" --backend xnnpack --contexts "$CONTEXTS")
          echo "$entries"
          echo "entries=$entries" >>"$GITHUB_OUTPUT"
          echo "contexts=$(python3 -c 'import json,sys; print(json.dumps([e["context"] for e in json.loads(sys.argv[1])]))' "$entries")" >>"$GITHUB_OUTPUT"
          # The solve holds the fp32 model (16 GB for a 4B) and one layer's Hessians. On
          # Blacksmith every solve up to LFM2.5-2.6B fit 23.4 GiB and past 3B took 48 GB. One
          # Namespace profile (15.7 GiB) now runs it; the models that would not fit it have no
          # window that fits an export either, so their solve is skipped with the empty matrix.
          params=$(python3 -c 'import sys; from pipeline import hub; print(hub.fetch(sys.argv[1], sys.argv[2]).total_params or 0)' "$MODEL_ID" "$REVISION")
          solve=namespace-profile-execupack
          echo "solve runner: $solve ($params parameters)"
          echo "solve_runner=$solve" >>"$GITHUB_OUTPUT"

  solve:
    # One solve per model, not per window: the codes are per linear, and the window changes
    # the KV cache and the masks, never the weights. Every window's export reuses this
    # artifact, which is why it is worth a job of its own.
    needs: targets
    # Nothing to solve for when no window fits a runner (an empty matrix).
    if: ${{ inputs.gptq && needs.targets.outputs.entries != '[]' }}
    # Sized on memory: it holds the fp32 model and one layer's Hessians (targets job).
    runs-on: ${{ needs.targets.outputs.solve_runner }}
    timeout-minutes: 350
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      MODEL_ID: ${{ inputs.model_id }}
      REVISION: ${{ inputs.revision }}
      QMODE: ${{ inputs.qmode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-export
        with:
          swap-gib: "24"

      - name: Solve the int4 codes
        run: |
          ONLY=""
          if [ -n "$QMODE" ] && [ "$QMODE" != "8da4w" ]; then ONLY="--reference-only"; fi
          python -m pipeline solve "$MODEL_ID" --revision "$REVISION" $ONLY \
            --out "$WORK_DIR/codes.pt" --work "$WORK_DIR/solve-work" | tee "$WORK_DIR/solve.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gptq-codes-${{ github.run_id }}
          path: |
            ${{ env.WORK_DIR }}/codes.pt
            ${{ env.WORK_DIR }}/solve.json
            ${{ env.WORK_DIR }}/gate.json
          retention-days: 7
          if-no-files-found: error

  export:
    needs: [targets, solve]
    # An empty matrix is an error to GitHub, so a model no runner can carry stops at targets.
    if: ${{ always() && needs.targets.result == 'success' && needs.targets.outputs.entries != '[]' && needs.solve.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.targets.outputs.entries) }}
    # Sized per window by the targets job: every attention layer holds a window x window
    # causal mask, so the need grows with the window squared, and a window no tier in
    # xnnpack.runner_tiers can carry is left out. Since 2026-10-07 that tier is the 15.7 GiB
    # Namespace profile (x86, no swap). The smoke test stays in its own job (verify).
    runs-on: ${{ matrix.entry.runner }}
    timeout-minutes: 350
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      MODEL_ID: ${{ inputs.model_id }}
      REVISION: ${{ inputs.revision }}
      QMODE: ${{ inputs.qmode }}
      CONTEXT: ${{ matrix.entry.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-export
        with:
          swap-gib: ${{ matrix.entry.swap_gib }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.gptq }}
        with:
          name: gptq-codes-${{ github.run_id }}
          path: ${{ env.WORK_DIR }}

      # Exit 4 means this runner cannot build this window (memory grows with the square of
      # the window): recorded as a skip, so the other windows' jobs stand on their own.
      - name: Export
        run: |
          echo "ARTIFACT=xnnpack-${MODEL_ID//\//--}-${CONTEXT}" >>"$GITHUB_ENV"
          set +e
          CODES=""
          if [ -f "$WORK_DIR/codes.pt" ]; then CODES="--codes $WORK_DIR/codes.pt"; fi
          python -m pipeline export-xnnpack "$MODEL_ID" --revision "$REVISION" --context "$CONTEXT" \
            --out "$WORK_DIR/out" --work "$WORK_DIR/work" $CODES --qmode "$QMODE" --skip-smoke
          rc=$?
          set -e
          if [ "$rc" -eq 4 ]; then
            echo "SKIPPED=1" >>"$GITHUB_ENV"
            echo "::warning title=Window skipped::$MODEL_ID at $CONTEXT tokens cannot be exported on this runner"
            exit 0
          fi
          exit "$rc"

      - name: Summary
        if: always() && env.SKIPPED != '1'
        run: |
          if compgen -G "$WORK_DIR/out/xnnpack/export-report*.json" >/dev/null; then
            python -m pipeline summary "$WORK_DIR/out" --backend xnnpack >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && env.SKIPPED != '1'
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.WORK_DIR }}/out
          retention-days: 14
          if-no-files-found: warn


  verify:
    # The smoke test, and only then the publish. ExecuTorch's runner raises IndexError: stoi
    # on aarch64 (finding 30), so this job has to be x86, as every job is now; it loads the .pte
    # the export built and asks the same question through the same C++ runner the app uses.
    needs: [targets, export]
    # Not `needs.export.result == 'success'`: the export matrix is fail-fast: false so that
    # one window standing on its own, and gating the whole verify matrix on every window
    # having succeeded threw that away. Qwen/Qwen3-1.7B lost a 32k export to a terminated
    # runner in run 35413952925, and the four windows that had built correctly were never
    # verified and never published because of it. Each verify job already stands down on
    # its own when its window uploaded no artifact, which is the per-window check this
    # should have relied on all along.
    if: ${{ always() && needs.targets.result == 'success' && needs.targets.outputs.entries != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        context: ${{ fromJSON(needs.targets.outputs.contexts) }}
    runs-on: namespace-profile-execupack
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      MODEL_ID: ${{ inputs.model_id }}
      CONTEXT: ${{ matrix.context }}
      GPTQ: ${{ inputs.gptq }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-export
        with:
          swap-gib: "8"

      - name: Name the export's artifact
        run: echo "ARTIFACT=xnnpack-${MODEL_ID//\//--}-${CONTEXT}" >>"$GITHUB_ENV"

      # A window the export skipped (too wide for its runner) uploads nothing, so this job
      # stands down instead of failing on a missing artifact.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: fetch
        continue-on-error: true
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.WORK_DIR }}/out

      - name: Note a skipped window
        if: steps.fetch.outcome != 'success'
        run: |
          echo "SKIPPED=1" >>"$GITHUB_ENV"
          echo "::notice title=Nothing to verify::$MODEL_ID at $CONTEXT tokens was not exported"

      # The fp32 model's own decisions on the gate prompts, measured in the solve job while
      # it was loaded. Without them the gate cannot run and says so; it never passes quietly.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.gptq && env.SKIPPED != '1' }}
        continue-on-error: true
        with:
          name: gptq-codes-${{ github.run_id }}
          path: ${{ env.WORK_DIR }}/gate

      - name: Smoke-test the exported file, then gate it on the fp32 model's decisions
        if: env.SKIPPED != '1'
        run: |
          GATE=""
          if [ -f "$WORK_DIR/gate/gate.json" ]; then
            GATE="--gate $WORK_DIR/gate/gate.json"
          elif [ "$GPTQ" = "true" ]; then
            # A solved run whose reference went missing must not fall through to an
            # unguarded publish: that is the exact silence this gate exists to end.
            echo "::error title=No decision gate::the solve produced no fp32 reference; refusing to publish ungated"
            exit 1
          else
            echo "::warning title=No decision gate::rounded run, so only the smoke test guards it"
          fi
          python -m pipeline verify "$WORK_DIR/out" --backend xnnpack --work "$WORK_DIR/verify-work" $GATE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.SKIPPED != '1'
        with:
          name: verified-${{ env.ARTIFACT }}
          path: ${{ env.WORK_DIR }}/out
          retention-days: 14
          if-no-files-found: error

      - name: Publish to Hugging Face
        if: inputs.publish_hf && env.SKIPPED != '1'
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Set the HF_TOKEN repository secret (write access to the output org)"
            exit 1
          fi
          python -m pipeline publish-hf "$WORK_DIR/out" --backend xnnpack

      - name: Publish GitHub release
        if: inputs.publish_release && env.SKIPPED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline publish-release "$WORK_DIR/out" --backend xnnpack
