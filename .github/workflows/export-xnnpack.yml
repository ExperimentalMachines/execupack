name: Export XNNPACK
run-name: "XNNPACK: ${{ inputs.model_id }}@${{ inputs.revision }}${{ inputs.contexts && format(' ctx {0}', inputs.contexts) || '' }}"

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Hugging Face model id, e.g. Qwen/Qwen3-1.7B
        required: true
        type: string
      revision:
        description: Branch, tag or commit of the source repo
        default: main
        type: string
      contexts:
        description: JSON list of context windows in tokens, one job each; empty for every tier in config/pipeline.yaml
        default: ""
        type: string
      gptq:
        description: Solve the int4 codes with GPTQ instead of rounding them (one solve, reused by every window)
        default: true
        type: boolean
      qmode:
        description: "Recipe: empty for the config's 8da4w, or fp32 (linears not quantized; the solve only writes the gate's fp32 reference)"
        default: ""
        type: string
      vulkan:
        description: Also build each window's Vulkan (GPU) file from the same solved codes, gated through that window's XNNPACK file (GPTQ 8da4w runs of models Vulkan can take)
        default: true
        type: boolean
      publish_hf:
        description: Publish to the Hugging Face org in config/pipeline.yaml
        default: true
        type: boolean
      publish_release:
        description: Attach the files to a GitHub release
        default: true
        type: boolean

permissions:
  contents: write # GitHub releases

concurrency:
  group: export-xnnpack-${{ inputs.model_id }}
  cancel-in-progress: false

jobs:
  targets:
    # Hub metadata only, no model download: reads config.json and does arithmetic.
    runs-on: ubuntu-latest
    env:
      # Sizing reads the model's config, and gated repos (Llama 3.2) need the token.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    outputs:
      entries: ${{ steps.contexts.outputs.entries }}
      solve_memory: ${{ steps.contexts.outputs.solve_memory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-light
      - id: contexts
        env:
          CONTEXTS: ${{ inputs.contexts }}
          MODEL_ID: ${{ inputs.model_id }}
          REVISION: ${{ inputs.revision }}
          VULKAN: ${{ inputs.vulkan }}
          GPTQ: ${{ inputs.gptq }}
          QMODE: ${{ inputs.qmode }}
        # One entry per window with the memory its Modal Sandbox asks for (export-matrix over
        # xnnpack.runner_tiers: sizing.host_need_bytes plus modal.memory_margin). A window past
        # what Modal allows is left out here. With --with-vulkan each entry also says whether
        # its job builds the Vulkan file (the model can take Vulkan and the window fits Modal),
        # and asks for whichever of the two exports needs more. Never for a rounded or fp32 run:
        # a GPU file is built only from solved codes, gated through its XNNPACK twin.
        run: |
          WITH_VULKAN=""
          if [ "$VULKAN" = "true" ] && [ "$GPTQ" = "true" ] && { [ -z "$QMODE" ] || [ "$QMODE" = "8da4w" ]; }; then
            WITH_VULKAN="--with-vulkan"
          fi
          entries=$(python3 -m pipeline export-matrix "$MODEL_ID" --revision "$REVISION" --backend xnnpack --contexts "$CONTEXTS" $WITH_VULKAN)
          echo "$entries"
          echo "entries=$entries" >>"$GITHUB_OUTPUT"
          # The solve holds the fp32 model (16 GB for a 4B) and one layer's Hessians: about 12
          # bytes a parameter, as the Blacksmith solves measured (solve-memory).
          solve=$(python3 -m pipeline solve-memory "$MODEL_ID" --revision "$REVISION")
          echo "solve: $solve MiB"
          echo "solve_memory=$solve" >>"$GITHUB_OUTPUT"

  solve:
    # One solve per model, not per window: the codes are per linear, and the window changes
    # the KV cache and the masks, never the weights. Every window's export reuses this
    # artifact, which is why it is worth a job of its own.
    needs: targets
    # Nothing to solve for when no window fits (an empty matrix).
    if: ${{ inputs.gptq && needs.targets.outputs.entries != '[]' }}
    # The solve runs on Modal with the memory targets asked for; this job waits on it.
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      MODEL_ID: ${{ inputs.model_id }}
      REVISION: ${{ inputs.revision }}
      QMODE: ${{ inputs.qmode }}
      MEMORY_MIB: ${{ needs.targets.outputs.solve_memory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-modal

      - name: Solve the int4 codes on Modal
        run: |
          python -m pipeline modal-run --memory-mib "$MEMORY_MIB" --requirements requirements/export-xnnpack.txt \
            --get "$WORK_DIR" \
            --script 'set -o pipefail
          ONLY=""
          if [ -n "$QMODE" ] && [ "$QMODE" != "8da4w" ]; then ONLY="--reference-only"; fi
          python -m pipeline solve "$MODEL_ID" --revision "$REVISION" $ONLY \
            --out "$OUT/codes.pt" --work "$WORK/solve-work" | tee "$OUT/solve.json"'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gptq-codes-${{ github.run_id }}
          path: |
            ${{ env.WORK_DIR }}/codes.pt
            ${{ env.WORK_DIR }}/solve.json
            ${{ env.WORK_DIR }}/gate.json
          retention-days: 7
          if-no-files-found: error

  export:
    needs: [targets, solve]
    # An empty matrix is an error to GitHub, so a model no window fits stops at targets.
    if: ${{ always() && needs.targets.result == 'success' && needs.targets.outputs.entries != '[]' && needs.solve.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.targets.outputs.entries) }}
    # One Modal Sandbox per window, sized to it (memory_mib), runs the export, then the smoke
    # test through ExecuTorch's C++ runner, then the decision gate against the fp32 model's own
    # answers, and only then does this job publish. They used to be two jobs because the
    # runner fails on aarch64 (finding 30) and the export ran on ARM; on Modal both are x86.
    #
    # Then, for a window targets marked (export-matrix --with-vulkan: a GPTQ 8da4w run of a
    # model Vulkan can take), the Vulkan file, in a Sandbox of its own (vulkan_memory_mib): the
    # same solved codes in the same torchao linears, with the XNNPACK report just published as
    # its --gate-proxy. The host has no Vulkan runtime, so that verdict is the one it carries,
    # and export_xnnpack.check_gate_proxy refuses one built any other way. The CPU file is
    # published before the GPU Sandbox starts, so a GPU failure or timeout never costs it;
    # publishing it also withdraws, in the same commit, a Vulkan window whose gate was the file
    # it replaces (publish.orphaned_gpu_window), so the Hub never holds a GPU file citing a
    # gate that is not there. A Vulkan failure fails the job at the end.
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      MODEL_ID: ${{ inputs.model_id }}
      REVISION: ${{ inputs.revision }}
      QMODE: ${{ inputs.qmode }}
      GPTQ: ${{ inputs.gptq }}
      CONTEXT: ${{ matrix.entry.context }}
      MEMORY_MIB: ${{ matrix.entry.memory_mib }}
      VULKAN: ${{ matrix.entry.vulkan && 'true' || 'false' }}
      VULKAN_MEMORY_MIB: ${{ matrix.entry.vulkan_memory_mib }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-modal

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.gptq }}
        with:
          name: gptq-codes-${{ github.run_id }}
          path: ${{ env.WORK_DIR }}/in

      # Exit 4 means this window cannot be built (the export's own gate): recorded as a skip,
      # so the other windows' jobs stand on their own. The gate's rule is the one the verify
      # job had: a solved run with no fp32 reference refuses to publish rather than falling
      # through to an unguarded one.
      - name: Export, smoke-test and gate on Modal
        id: export
        run: |
          echo "ARTIFACT=xnnpack-${MODEL_ID//\//--}-${CONTEXT}" >>"$GITHUB_ENV"
          puts=()
          for f in codes.pt gate.json; do
            if [ -f "$WORK_DIR/in/$f" ]; then puts+=(--put "$WORK_DIR/in/$f"); fi
          done
          set +e
          python -m pipeline modal-run --memory-mib "$MEMORY_MIB" --requirements requirements/export-xnnpack.txt \
            "${puts[@]}" --get "$WORK_DIR/out" \
            --script '
          CODES=""
          if [ -f "$IN/codes.pt" ]; then CODES="--codes $IN/codes.pt"; fi
          python -m pipeline export-xnnpack "$MODEL_ID" --revision "$REVISION" --context "$CONTEXT" \
            --out "$OUT" --work "$WORK/export" $CODES --qmode "$QMODE" --skip-smoke || exit $?
          GATE=""
          if [ -f "$IN/gate.json" ]; then
            GATE="--gate $IN/gate.json"
          elif [ "$GPTQ" = "true" ]; then
            echo "::error title=No decision gate::the solve produced no fp32 reference; refusing to publish ungated"
            exit 1
          else
            echo "::warning title=No decision gate::rounded run, so only the smoke test guards it"
          fi
          python -m pipeline verify "$OUT" --backend xnnpack --work "$WORK/verify" $GATE'
          rc=$?
          set -e
          if [ "$rc" -eq 4 ]; then
            echo "SKIPPED=1" >>"$GITHUB_ENV"
            echo "::warning title=Window skipped::$MODEL_ID at $CONTEXT tokens cannot be exported"
            exit 0
          fi
          exit "$rc"

      - name: Summary
        if: always() && env.SKIPPED != '1'
        run: |
          if compgen -G "$WORK_DIR/out/xnnpack/export-report*.json" >/dev/null; then
            python -m pipeline summary "$WORK_DIR/out" --backend xnnpack >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && env.SKIPPED != '1'
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.WORK_DIR }}/out
          retention-days: 14
          if-no-files-found: warn

      - name: Publish to Hugging Face
        id: publish_xnnpack
        if: inputs.publish_hf && env.SKIPPED != '1'
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Set the HF_TOKEN repository secret (write access to the output org)"
            exit 1
          fi
          python -m pipeline publish-hf "$WORK_DIR/out" --backend xnnpack

      - name: Publish GitHub release
        id: release_xnnpack
        if: inputs.publish_release && env.SKIPPED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline publish-release "$WORK_DIR/out" --backend xnnpack

      # Its own Sandbox and its own clock: whatever happens here, the XNNPACK file above is
      # already out. Exit 4 is the Vulkan export's own size gate (no file for this window).
      - name: Build the Vulkan file on Modal
        if: ${{ !cancelled() && env.VULKAN == 'true' && env.SKIPPED != '1' && steps.export.outcome == 'success' && steps.publish_xnnpack.outcome != 'failure' }}
        timeout-minutes: 130
        run: |
          proxy=$(ls "$WORK_DIR"/out/xnnpack/export-report-*.json | head -1)
          set +e
          python -m pipeline modal-run --memory-mib "$VULKAN_MEMORY_MIB" --timeout-minutes 120 \
            --requirements requirements/export-xnnpack.txt \
            --put "$WORK_DIR/in/codes.pt" --put "$proxy" --get "$WORK_DIR/vulkan-out" \
            --script 'python -m pipeline export-vulkan "$MODEL_ID" --revision "$REVISION" --context "$CONTEXT" \
            --out "$OUT" --work "$WORK/vulkan" --codes "$IN/codes.pt" --gate-proxy "$(ls "$IN"/export-report-*.json)"'
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "VULKAN_BUILT=1" >>"$GITHUB_ENV"
            python -m pipeline summary "$WORK_DIR/vulkan-out" --backend vulkan >>"$GITHUB_STEP_SUMMARY"
          elif [ "$rc" -eq 4 ]; then
            echo "::warning title=Vulkan window skipped::$MODEL_ID at $CONTEXT tokens cannot be exported for Vulkan"
          else
            echo "VULKAN_FAILED=1" >>"$GITHUB_ENV"
            echo "::error title=Vulkan export failed::exit $rc; the XNNPACK file is published, this job fails at the end"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && (env.VULKAN_BUILT == '1' || env.VULKAN_FAILED == '1') }}
        with:
          name: vulkan-${{ env.ARTIFACT }}
          path: ${{ env.WORK_DIR }}/vulkan-out
          retention-days: 14
          if-no-files-found: warn

      # Only once its twin is on the Hub: a GPU file is never published citing a gate that
      # is not there to read.
      - name: Publish the Vulkan file to Hugging Face
        id: publish_vulkan
        if: ${{ !cancelled() && inputs.publish_hf && env.VULKAN_BUILT == '1' && steps.publish_xnnpack.outcome == 'success' }}
        run: python -m pipeline publish-hf "$WORK_DIR/vulkan-out" --backend vulkan

      # Likewise only beside its twin's release, and, when the Hub is published to, only once the
      # GPU file is there too (a skipped step is not a success).
      - name: Publish the Vulkan GitHub release
        if: ${{ !cancelled() && inputs.publish_release && env.VULKAN_BUILT == '1' && steps.release_xnnpack.outcome == 'success' && (!inputs.publish_hf || steps.publish_vulkan.outcome == 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline publish-release "$WORK_DIR/vulkan-out" --backend vulkan

      - name: Fail on a Vulkan export that did not build
        if: ${{ !cancelled() && env.VULKAN_FAILED == '1' }}
        run: |
          echo "::error::the Vulkan export failed after the XNNPACK file was published; see the Vulkan step"
          exit 1
