name: Export QNN
run-name: "QNN: ${{ inputs.model_id }}@${{ inputs.revision }}${{ inputs.contexts && format(' ctx {0}', inputs.contexts) || '' }}"

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Hugging Face model id listed in ExecuTorch 1.4.0's Qualcomm LLM scripts, e.g. Qwen/Qwen3-1.7B
        required: true
        type: string
      revision:
        description: Branch, tag or commit of the source repo; the Qualcomm script compiles main, so the run refuses anything else
        default: main
        type: string
      socs:
        description: JSON list of chips, or empty for qnn.socs in config/pipeline.yaml
        default: ""
        type: string
      contexts:
        description: JSON list of context windows in tokens, one job per chip and window; empty for every tier in config/pipeline.yaml
        default: ""
        type: string
      publish_hf:
        description: Publish to the Hugging Face org in config/pipeline.yaml
        default: true
        type: boolean
      publish_release:
        description: Attach the files to a GitHub release
        default: true
        type: boolean

permissions:
  contents: write # GitHub releases

concurrency:
  group: export-qnn-${{ inputs.model_id }}
  cancel-in-progress: false

jobs:
  targets:
    # Hub metadata only, no model download: a parameter count and arithmetic.
    runs-on: ubuntu-latest
    env:
      # Llama 3.2 is gated, so even its metadata needs the token.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    outputs:
      socs: ${{ steps.socs.outputs.socs }}
      entries: ${{ steps.contexts.outputs.entries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-light
      - id: socs
        env:
          SOCS: ${{ inputs.socs }}
        run: |
          if [ -z "$SOCS" ]; then
            SOCS=$(python3 -c 'import json, yaml; print(json.dumps(yaml.safe_load(open("config/pipeline.yaml"))["export"]["qnn"]["socs"]))')
          fi
          echo "socs=$SOCS" >>"$GITHUB_OUTPUT"
      - id: contexts
        env:
          CONTEXTS: ${{ inputs.contexts }}
          MODEL_ID: ${{ inputs.model_id }}
          REVISION: ${{ inputs.revision }}
        # One entry per window with the Modal Sandbox it gets: memory, cores and minutes from
        # pipeline.export_qnn.modal_request. Accepts a JSON list, one number, or a
        # comma-separated list; empty means every tier.
        run: |
          entries=$(python3 -m pipeline qnn-matrix "$MODEL_ID" --revision "$REVISION" --contexts "$CONTEXTS")
          echo "$entries"
          echo "entries=$entries" >>"$GITHUB_OUTPUT"

  export:
    needs: targets
    # An empty matrix is an error to GitHub.
    if: ${{ needs.targets.outputs.entries != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        soc: ${{ fromJSON(needs.targets.outputs.socs) }}
        entry: ${{ fromJSON(needs.targets.outputs.entries) }}
    # The export runs on Modal, in a Sandbox the targets job sized to this model and window;
    # this job only sends it, waits, and publishes what comes back. Modal's hosts are x86,
    # which the Qualcomm backend needs: it ships only in the executorch Linux x86_64 wheel,
    # and the QAIRT SDK is x86_64. The wheel downloads QAIRT inside the Sandbox on first
    # import (export_qnn.qnn_sdk), so the SDK is fetched from Qualcomm on every run and never
    # stored in an image, a cache or the Volume.
    runs-on: ubuntu-latest
    # GitHub-hosted jobs stop at 360 minutes: past the longest Sandbox (export_qnn.QNN_MODAL_SHAPES),
    # so the Sandbox is what times out and says so.
    timeout-minutes: 350
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      MODEL_ID: ${{ inputs.model_id }}
      REVISION: ${{ inputs.revision }}
      SOC: ${{ matrix.soc }}
      CONTEXT: ${{ matrix.entry.context }}
      MEMORY_MIB: ${{ matrix.entry.memory_mib }}
      CORES: ${{ matrix.entry.cpu }}
      SANDBOX_MINUTES: ${{ matrix.entry.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-modal

      - name: Name things
        run: |
          soc_lower=$(echo "$SOC" | tr '[:upper:]' '[:lower:]')
          echo "TARGET=$soc_lower" >>"$GITHUB_ENV"
          echo "ARTIFACT=qnn-${soc_lower}-${MODEL_ID//\//--}-${CONTEXT}" >>"$GITHUB_ENV"

      # Exit 4 means this window cannot be built: recorded as a skip, so the other jobs of the
      # matrix stand on their own.
      - name: Export on Modal
        run: |
          set +e
          python -m pipeline modal-run --memory-mib "$MEMORY_MIB" --cpu "$CORES" --timeout-minutes "$SANDBOX_MINUTES" \
            --requirements requirements/export-qnn.txt --get "$WORK_DIR/out" \
            --script 'python -m pipeline export-qnn "$MODEL_ID" --soc "$SOC" --revision "$REVISION" --out "$OUT" --work "$WORK/export" --context "$CONTEXT"'
          rc=$?
          set -e
          if [ "$rc" -eq 4 ]; then
            echo "SKIPPED=1" >>"$GITHUB_ENV"
            echo "::warning title=Window skipped::$MODEL_ID at $CONTEXT tokens on $SOC cannot be exported"
            exit 0
          fi
          exit "$rc"

      - name: Summary
        if: always() && env.SKIPPED != '1'
        run: |
          if compgen -G "$WORK_DIR/out/qnn/$TARGET/export-report*.json" >/dev/null; then
            python -m pipeline summary "$WORK_DIR/out" --backend qnn --target "$TARGET" >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && env.SKIPPED != '1'
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.WORK_DIR }}/out
          retention-days: 14
          if-no-files-found: warn

      - name: Publish to Hugging Face
        if: inputs.publish_hf && env.SKIPPED != '1'
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Set the HF_TOKEN repository secret (write access to the output org)"
            exit 1
          fi
          python -m pipeline publish-hf "$WORK_DIR/out" --backend qnn --target "$TARGET"

      - name: Publish GitHub release
        if: inputs.publish_release && env.SKIPPED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline publish-release "$WORK_DIR/out" --backend qnn --target "$TARGET"
